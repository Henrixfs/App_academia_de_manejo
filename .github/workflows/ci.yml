name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academia_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academia_test
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement backend/requirements.txt pip-audit
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pytest -q --cov=app.services --cov-report=term --cov-fail-under=85
        working-directory: backend
      - run: pytest -q --cov=app.routers --cov-report=term --cov-fail-under=75
        working-directory: backend
      - run: pip-audit --requirement backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:8000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun run typecheck
        working-directory: frontend
      - run: bun run test:coverage
        working-directory: frontend
      - run: bun run build
        working-directory: frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - run: bun run test:e2e -- --project=chromium
        working-directory: frontend
      - run: bun audit --audit-level=high
        working-directory: frontend
