<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Registro - Academia de Manejo San Cristóbal VIP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#45464d",
                        "outline": "#76777d",
                        "tertiary": "#000000",
                        "on-tertiary-fixed": "#001a42",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#adc6ff",
                        "on-primary-fixed": "#131b2e",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-container": "#3980f4",
                        "on-primary-fixed-variant": "#3f465c",
                        "on-secondary-fixed-variant": "#653e00",
                        "secondary-fixed": "#ffddb8",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-fixed": "#d8e2ff",
                        "on-surface": "#191c1e",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#bec6e0",
                        "success-green": "#10B981",
                        "inverse-surface": "#2d3133",
                        "on-background": "#191c1e",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-container": "#131b2e",
                        "on-secondary-container": "#684000",
                        "outline-variant": "#c6c6cd",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface": "#f7f9fb",
                        "primary": "#000000",
                        "on-primary-container": "#7c839b",
                        "safety-blue": "#1E3A8A",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#855300",
                        "background": "#f7f9fb",
                        "surface-container-high": "#e6e8ea",
                        "road-gray": "#475569",
                        "surface-dim": "#d8dadc",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed": "#2a1700",
                        "secondary-container": "#fea619",
                        "surface-container-low": "#f2f4f6",
                        "caution-amber": "#D97706",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#001a42",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-tint": "#565e74",
                        "secondary-fixed-dim": "#ffb95f",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed-variant": "#004395"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xl": "80px",
                        "sm": "16px",
                        "margin-mobile": "16px",
                        "xs": "8px",
                        "margin-desktop": "64px",
                        "lg": "48px",
                        "gutter": "24px",
                        "base": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Manrope"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Manrope"],
                        "body-md": ["Inter"],
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "label-md": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Decor -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-fixed opacity-50 blur-[100px]"></div>
<div class="absolute bottom-[10%] -right-[5%] w-[30%] h-[30%] rounded-full bg-tertiary-fixed opacity-50 blur-[80px]"></div>
</div>
<!-- Registration Container -->
<main class="w-full max-w-md mx-margin-mobile md:mx-auto z-10 relative">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-surface-variant overflow-hidden">
<!-- Header Section -->
<div class="px-md pt-lg pb-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container mb-md mx-auto shadow-sm">
<span class="material-symbols-outlined fill text-[32px] text-on-primary" data-icon="directions_car">directions_car</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Crear Cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant">San Cristóbal VIP - Academia de Manejo</p>
</div>
<!-- Form Section -->
<div class="px-md pb-lg">
<form class="flex flex-col gap-sm" id="registrationForm" novalidate="">
<!-- Nombre Completo -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Nombre Completo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="person">person</span>
<input class="w-full h-12 pl-12 pr-sm rounded-lg border border-road-gray bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-safety-blue focus:ring-1 focus:ring-safety-blue transition-all" id="fullName" name="fullName" placeholder="Ej: Juan Pérez" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-12 pl-12 pr-sm rounded-lg border border-road-gray bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-safety-blue focus:ring-1 focus:ring-safety-blue transition-all" id="email" name="email" placeholder="tu@email.com" required="" type="email"/>
</div>
</div>
<!-- Teléfono (Opcional) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="phone">Teléfono <span class="text-on-surface-variant font-normal">(Opcional)</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="phone">phone</span>
<input class="w-full h-12 pl-12 pr-sm rounded-lg border border-road-gray bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-safety-blue focus:ring-1 focus:ring-safety-blue transition-all" id="phone" name="phone" placeholder="Ej: 987654321" type="tel"/>
</div>
</div>
<!-- Contraseña -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-12 pl-12 pr-sm rounded-lg border border-road-gray bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-safety-blue focus:ring-1 focus:ring-safety-blue transition-all" id="password" minlength="6" name="password" placeholder="Mínimo 6 caracteres" required="" type="password"/>
</div>
<p class="font-caption text-caption text-error hidden mt-1" id="passwordError">La contraseña debe tener al menos 6 caracteres.</p>
</div>
<!-- Submit Button -->
<button class="mt-md w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center gap-xs hover:bg-safety-blue transition-colors shadow-sm" type="submit">
                        Registrarse
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-md text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        ¿Ya tienes cuenta? 
                        <a class="font-label-md text-label-md text-safety-blue hover:underline decoration-2 underline-offset-4" href="#">Iniciar Sesión</a>
</p>
</div>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registrationForm');
            const passwordInput = document.getElementById('password');
            const passwordError = document.getElementById('passwordError');
            const inputs = form.querySelectorAll('input');

            // Basic visual validation
            inputs.forEach(input => {
                input.addEventListener('blur', () => {
                    if (!input.validity.valid) {
                        input.classList.add('border-error');
                        input.classList.remove('border-road-gray', 'focus:border-safety-blue');
                    } else {
                        input.classList.remove('border-error');
                        input.classList.add('border-road-gray', 'focus:border-safety-blue');
                    }
                });

                input.addEventListener('input', () => {
                     if (input.validity.valid) {
                        input.classList.remove('border-error');
                        input.classList.add('border-road-gray', 'focus:border-safety-blue');
                     }
                });
            });

            // Specific password validation
            passwordInput.addEventListener('input', () => {
                if (passwordInput.value.length > 0 && passwordInput.value.length < 6) {
                    passwordError.classList.remove('hidden');
                    passwordInput.classList.add('border-error');
                } else {
                    passwordError.classList.add('hidden');
                    if(passwordInput.value.length >= 6) {
                       passwordInput.classList.remove('border-error');
                    }
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                inputs.forEach(input => {
                    if (!input.validity.valid) {
                        input.classList.add('border-error');
                        isValid = false;
                    }
                });

                if (passwordInput.value.length < 6) {
                    passwordError.classList.remove('hidden');
                    passwordInput.classList.add('border-error');
                    isValid = false;
                }

                if (isValid) {
                    // Simulate successful registration
                    const btn = form.querySelector('button[type="submit"]');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]" data-icon="progress_activity">progress_activity</span> Registrando...';
                    btn.disabled = true;

                    setTimeout(() => {
                        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]" data-icon="check_circle">check_circle</span> ¡Registro Exitoso!';
                        btn.classList.replace('bg-primary', 'bg-success-green');
                        btn.classList.replace('hover:bg-safety-blue', 'hover:bg-success-green');
                        
                        setTimeout(() => {
                            // Reset form or redirect
                            btn.innerHTML = originalText;
                            btn.disabled = false;
                            btn.classList.replace('bg-success-green', 'bg-primary');
                            btn.classList.replace('hover:bg-success-green', 'hover:bg-safety-blue');
                            form.reset();
                        }, 2000);
                    }, 1500);
                }
            });
        });
    </script>
</body></html>
