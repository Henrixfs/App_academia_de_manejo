services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://host.docker.internal:8000
    environment:
      BACKEND_URL: http://host.docker.internal:8000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL es obligatorio}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
