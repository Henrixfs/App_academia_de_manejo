services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academia_manejo
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia_manejo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD}@postgres:5432/academia_manejo
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD}@postgres:5432/academia_manejo
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
      CORS_ORIGINS: ${APP_URL:?APP_URL es obligatorio}
      APP_URL: ${APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL es obligatorio}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
