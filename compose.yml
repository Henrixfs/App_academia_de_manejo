name: academia-manejo

x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academia_manejo
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia_manejo"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private
    logging: *default-logging
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD}@postgres:5432/academia_manejo
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging
    restart: "no"

  bootstrap-admin:
    profiles: ["bootstrap"]
    build: ./backend
    command: ["python", "-m", "app.seed"]
    environment:
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}@postgres:5432/academia_manejo
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRES: ${ADMIN_NOMBRES:-Administrador}
      ADMIN_APELLIDOS: ${ADMIN_APELLIDOS:-Sistema}
      ADMIN_TELEFONO: ${ADMIN_TELEFONO:-000000000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    logging: *default-logging
    restart: "no"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://academia:${POSTGRES_PASSWORD}@postgres:5432/academia_manejo
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
      CORS_ORIGINS: ${APP_URL:?APP_URL es obligatorio}
      APP_URL: ${APP_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - private
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL es obligatorio}
    environment:
      BACKEND_URL: http://backend:8000
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL es obligatorio}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - private
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - private
    logging: *default-logging
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  edge:
  private:
    internal: true
