# Alembic Configuration File
# Academia de Manejo San Cristóbal VIP
#
# Ejecutar SIEMPRE desde la carpeta: backend/
# Ejemplo: cd backend && alembic upgrade head

[alembic]
# Ruta al directorio de scripts de migración (relativa a este archivo)
script_location = alembic

# La URL de base de datos es inyectada desde DATABASE_URL en alembic/env.py
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
