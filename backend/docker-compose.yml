# Para levantar:  docker-compose up -d
# Para ver logs:  docker-compose logs -f postgres
# Para acceder:   psql postgresql://postgres:password@localhost:5432/academia_manejo
# Para bajar:     docker-compose down


services:
  postgres:
    image: postgres:16-alpine
    container_name: academia_manejo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: academia_manejo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - academia_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academia_manejo_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/academia_manejo
      DEBUG: "True"
      SECRET_KEY: dev-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - academia_network
    volumes:
      - .:/app  # Para desarrollo con hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  academia_network:
    driver: bridge