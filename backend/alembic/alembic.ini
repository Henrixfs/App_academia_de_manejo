# Alembic Configuration File
# Academia de Manejo San Cristóbal VIP
#
# Para más opciones de configuración: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Ruta al directorio de scripts de migración (relativa a la ubicación de este archivo)
script_location = alembic

# Plantilla para nombres de versiones de migración
# file_template = %%(rev)s_%%(slug)s

# Timezone para los timestamps de revisión
# timezone = UTC

# Truncar mensajes de cambio a esta longitud
# truncate_slug_length = 40

# La URL de base de datos es inyectada programáticamente desde DATABASE_URL
# en alembic/env.py. No se define aquí para evitar credenciales en el repositorio.
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging — Configuración estándar de Python logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
